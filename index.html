<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Transaksi - FinTrack</title>

    <!-- CSS GLOBAL -->
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="style2.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">    
</head>

<body>

    <!-- ================= NAVBAR ================= -->
    <header id="navbar">

        <div id="logo">
            <i class="fa-solid fa-wallet"></i>
            <span>FinTrack</span>
        </div>

        <nav id="menu">
            <a href="transaksi.html" class="active">
                <i class="fa-solid fa-receipt"></i>
                Menu Utama
            </a>
        </nav>

        <div id="profile">
            <div id="profile-icon">
                <i class="fa-solid fa-user"></i>
            </div>

            <div id="profile-info">
                <strong>Fauzan</strong>
                <span>Personal</span>
            </div>
        </div>

        <!-- Hamburger -->
        <button id="hamburger">
            <i class="fa-solid fa-bars"></i>
        </button>

    </header>


    <!-- =========================
         MAIN
    ========================== -->

    <main id="transactionPage">

        <!-- TITLE -->

        <section id="transactionHeader">

            <div>
                <h1>Transaksi</h1>

                <p>
                    Kelola dan pantau semua transaksi keuangan kamu.
                </p>
            </div>

            <button id="addTransactionButton">
                + Tambah Transaksi
            </button>

        </section>


        <!-- =========================
             SUMMARY
        ========================== -->

        <section id="transactionSummary">

            <div id="incomeCard">

                <span>Pemasukan</span>

                <h2 id="totalIncome">
                    Rp0
                </h2>

            </div>


            <div id="expenseCard">

                <span>Pengeluaran</span>

                <h2 id="totalExpense">
                    Rp0
                </h2>

            </div>


            <div id="balanceCard">

                <span>Saldo</span>

                <h2 id="totalBalance">
                    Rp0
                </h2>

            </div>

        </section>


        <!-- =========================
             FILTER
        ========================== -->

        <section id="transactionFilter">

            <input
                type="text"
                id="searchTransaction"
                placeholder="Cari transaksi..."
            >

            <select id="filterType">

                <option value="all">
                    Semua
                </option>

                <option value="income">
                    Pemasukan
                </option>

                <option value="expense">
                    Pengeluaran
                </option>

            </select>


            <select id="filterCategory">

                <option value="all">
                    Semua Kategori
                </option>

                <option value="food">
                    Makanan
                </option>

                <option value="transport">
                    Transportasi
                </option>

                <option value="entertainment">
                    Hiburan
                </option>

                <option value="shopping">
                    Belanja
                </option>

                <option value="education">
                    Pendidikan
                </option>

                <option value="other">
                    Lainnya
                </option>

            </select>

        </section>


        <!-- =========================
             TRANSACTION LIST
        ========================== -->

        <section id="transactionList">

            <div id="transactionListHeader">

                <h2>Riwayat Transaksi</h2>

            </div>


            <div id="transactionTableWrapper">

                <table id="transactionTable">

                    <thead>

                        <tr>

                            <th>Tanggal</th>

                            <th>Nama Transaksi</th>

                            <th>Kategori</th>

                            <th>Jenis</th>

                            <th>Jumlah</th>

                            <th>Aksi</th>

                        </tr>

                    </thead>


                    <tbody id="transactionTableBody">

                        <!-- Data transaksi akan muncul melalui JavaScript -->

                    </tbody>

                </table>


                <div id="emptyTransaction">

                    <h3>Belum ada transaksi</h3>

                    <p>
                        Tambahkan transaksi pertama kamu.
                    </p>

                </div>

            </div>

        </section>

    </main>


    <!-- =========================
         MODAL TAMBAH TRANSAKSI
    ========================== -->

    <div id="transactionModal">

        <div id="transactionModalContent">

            <div id="modalHeader">

                <h2>Tambah Transaksi</h2>

                <button id="closeTransactionModal">
                    ×
                </button>

            </div>


            <form id="transactionForm">

                <!-- NAMA -->

                <div id="transactionNameGroup">

                    <label for="transactionName">
                        Nama Transaksi
                    </label>

                    <input
                        type="text"
                        id="transactionName"
                        placeholder="Contoh: Makan siang"
                        required
                    >

                </div>


                <!-- JUMLAH -->

                <div id="transactionAmountGroup">

                    <label for="transactionAmount">
                        Jumlah
                    </label>

                    <input
                        type="number"
                        id="transactionAmount"
                        placeholder="Contoh: 25000"
                        min="0"
                        required
                    >

                </div>


                <!-- TANGGAL -->

                <div id="transactionDateGroup">

                    <label for="transactionDate">
                        Tanggal
                    </label>

                    <input
                        type="date"
                        id="transactionDate"
                        required
                    >

                </div>


                <!-- JENIS -->

                <div id="transactionTypeGroup">

                    <label for="transactionType">
                        Jenis Transaksi
                    </label>

                    <select id="transactionType" required>

                        <option value="">
                            Pilih jenis transaksi
                        </option>

                        <option value="income">
                            Pemasukan
                        </option>

                        <option value="expense">
                            Pengeluaran
                        </option>

                    </select>

                </div>


                <!-- KATEGORI -->

                <div id="transactionCategoryGroup">

                    <label for="transactionCategory">
                        Kategori
                    </label>

                    <select id="transactionCategory" required>

                        <option value="">
                            Pilih kategori
                        </option>

                        <option value="food">
                            Makanan
                        </option>

                        <option value="transport">
                            Transportasi
                        </option>

                        <option value="entertainment">
                            Hiburan
                        </option>

                        <option value="shopping">
                            Belanja
                        </option>

                        <option value="education">
                            Pendidikan
                        </option>

                        <option value="other">
                            Lainnya
                        </option>

                    </select>

                </div>


                <!-- CATATAN -->

                <div id="transactionNoteGroup">

                    <label for="transactionNote">
                        Catatan
                    </label>

                    <textarea
                        id="transactionNote"
                        placeholder="Tambahkan catatan (opsional)"
                    ></textarea>

                </div>


                <!-- BUTTON -->

                <div id="transactionFormButton">

                    <button
                        type="button"
                        id="cancelTransactionButton"
                    >
                        Batal
                    </button>

                    <button
                        type="submit"
                        id="saveTransactionButton"
                    >
                        Simpan Transaksi
                    </button>

                </div>

            </form>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="script2.js"></script>

</body>

</html>
```
